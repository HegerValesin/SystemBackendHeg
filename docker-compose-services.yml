services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        SERVICE: auth-service
        SERVICE_PORT: 3001
    environment:
      NODE_ENV: production
      TCP_HOST: 0.0.0.0
      TCP_PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DB_HOST: ${AUTH_DB_HOST}
      DB_PORT: ${AUTH_DB_PORT:-5432}
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_DATABASE: ${AUTH_DB_DATABASE:-auth_db}
      REGISTRY_SERVICE_HOST: registry-service
      REGISTRY_SERVICE_PORT: 3002
    ports:
      - '3001:3001'
    depends_on:
      registry-service:
        condition: service_started

  registry-service:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        SERVICE: registry-service
        SERVICE_PORT: 3002
    environment:
      NODE_ENV: production
      TCP_HOST: 0.0.0.0
      TCP_PORT: 3002
      DB_HOST: ${REGISTRY_DB_HOST}
      DB_PORT: ${REGISTRY_DB_PORT:-5432}
      DB_USERNAME: ${REGISTRY_DB_USERNAME}
      DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
      DB_DATABASE: ${REGISTRY_DB_DATABASE:-registry_db}
    ports:
      - '3002:3002'

  operations-service:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        SERVICE: operations-service
        SERVICE_PORT: 3003
    environment:
      NODE_ENV: production
      TCP_HOST: 0.0.0.0
      TCP_PORT: 3003
      DB_HOST: ${OPERATIONS_DB_HOST}
      DB_PORT: ${OPERATIONS_DB_PORT:-5432}
      DB_USERNAME: ${OPERATIONS_DB_USERNAME}
      DB_PASSWORD: ${OPERATIONS_DB_PASSWORD}
      DB_DATABASE: ${OPERATIONS_DB_DATABASE:-operations_db}
      REGISTRY_SERVICE_HOST: registry-service
      REGISTRY_SERVICE_PORT: 3002
      DOCUMENTS_SERVICE_HOST: documents-service
      DOCUMENTS_SERVICE_PORT: 3004
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - '3003:3003'
    depends_on:
      registry-service:
        condition: service_started
      documents-service:
        condition: service_started

  documents-service:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        SERVICE: documents-service
        SERVICE_PORT: 3004
    environment:
      NODE_ENV: production
      TCP_HOST: 0.0.0.0
      TCP_PORT: 3004
      DATABASE_URL: postgres://${DOCUMENTS_DB_USERNAME}:${DOCUMENTS_DB_PASSWORD}@${DOCUMENTS_DB_HOST}:${DOCUMENTS_DB_PORT:-5432}/${DOCUMENTS_DB_DATABASE:-documents_db}
      OPERATIONS_SERVICE_HOST: operations-service
      OPERATIONS_SERVICE_PORT: 3003
      REGISTRY_SERVICE_HOST: registry-service
      REGISTRY_SERVICE_PORT: 3002
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - '3004:3004'
    depends_on:
      registry-service:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        SERVICE: gateway
        SERVICE_PORT: 3000
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      REGISTRY_SERVICE_HOST: registry-service
      REGISTRY_SERVICE_PORT: 3002
      OPERATIONS_SERVICE_HOST: operations-service
      OPERATIONS_SERVICE_PORT: 3003
      DOCUMENTS_SERVICE_HOST: documents-service
      DOCUMENTS_SERVICE_PORT: 3004
      CORS_ORIGIN: ${CORS_ORIGIN:-https://transporte.hedsistemas.dev.br}
    ports:
      - '3000:3000'
    depends_on:
      auth-service:
        condition: service_started
      registry-service:
        condition: service_started
      operations-service:
        condition: service_started
      documents-service:
        condition: service_started
