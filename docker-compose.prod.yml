services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      POSTGRES_DB: ${POSTGRES_DB:-logistica_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY_required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY_required}
    volumes:
      - minio-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-logistica}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS_required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        SERVICE: gateway
        SERVICE_PORT: 3000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONOLITH_TCP_HOST: 0.0.0.0
      MONOLITH_TCP_PORT: 3001
      AUTH_SERVICE_HOST: 127.0.0.1
      AUTH_SERVICE_PORT: 3001
      REGISTRY_SERVICE_HOST: 127.0.0.1
      REGISTRY_SERVICE_PORT: 3001
      OPERATIONS_SERVICE_HOST: 127.0.0.1
      OPERATIONS_SERVICE_PORT: 3001
      DOCUMENTS_SERVICE_HOST: 127.0.0.1
      DOCUMENTS_SERVICE_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB:-logistica_db}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-logistica_db}
      DB_SYNCHRONIZE: 'false'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-logistica}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN_required}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
