services:
  postgres:
    image: postgres:16-alpine
    container_name: logistica-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-logistica_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: logistica-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY no arquivo .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY no arquivo .env}
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ':9001'
    volumes:
      - minio-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: logistica-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-logistica}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS no arquivo .env}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  backend:
    image: node:20-alpine
    container_name: logistica-backend
    working_dir: /app
    command: sh -c 'npm install && npm run dev:monolith'
    environment:
      NODE_ENV: development
      PORT: 3000
      MONOLITH_TCP_HOST: 0.0.0.0
      MONOLITH_TCP_PORT: 3001
      AUTH_SERVICE_HOST: 127.0.0.1
      AUTH_SERVICE_PORT: 3001
      REGISTRY_SERVICE_HOST: 127.0.0.1
      REGISTRY_SERVICE_PORT: 3001
      OPERATIONS_SERVICE_HOST: 127.0.0.1
      OPERATIONS_SERVICE_PORT: 3001
      DOCUMENTS_SERVICE_HOST: 127.0.0.1
      DOCUMENTS_SERVICE_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB:-logistica_db}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-logistica_db}
      # Use true somente para criar um banco local vazio. Em produção use migrations.
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-logistica}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:3000}
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
