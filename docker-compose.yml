services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enzo2003*
      POSTGRES_DB: auth_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth_db']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-registry:
    image: postgres:16-alpine
    container_name: postgres-registry
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enzo2003*
      POSTGRES_DB: registry_db
    ports:
      - '5433:5432'
    volumes:
      - postgres-registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d registry_db']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-operations:
    image: postgres:16-alpine
    container_name: postgres-operations
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enzo2003*
      POSTGRES_DB: operations_db
    ports:
      - '5434:5432'
    volumes:
      - postgres-operations-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d operations_db']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-documents:
    image: postgres:16-alpine
    container_name: postgres-documents
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enzo2003*
      POSTGRES_DB: documents_db
    ports:
      - '5435:5432'
    volumes:
      - postgres-documents-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d documents_db']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notifications:
    image: postgres:16-alpine
    container_name: postgres-notifications
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enzo2003*
      POSTGRES_DB: notifications_db
    ports:
      - '5436:5432'
    volumes:
      - postgres-notifications-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d notifications_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: hegervfp
      MINIO_ROOT_PASSWORD: enzo2003*
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5

  auth-service:
    image: node:20-alpine
    container_name: auth-service
    working_dir: /app
    command: sh -c "npm install && npm run start:dev --workspace=auth-service"
    environment:
      NODE_ENV: development
      TCP_HOST: 0.0.0.0
      TCP_PORT: 3001
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: enzo2003*
      DB_DATABASE: auth_db
      REGISTRY_SERVICE_HOST: registry-service
      REGISTRY_SERVICE_PORT: 3002
    ports:
      - '3001:3001'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres-auth:
        condition: service_healthy
      registry-service:
        condition: service_started

  registry-service:
    image: node:20-alpine
    container_name: registry-service
    working_dir: /app
    command: sh -c "npm install && npm run start:dev --workspace=registry-service"
    environment:
      NODE_ENV: development
      TCP_HOST: 0.0.0.0
      TCP_PORT: 3002
      DB_HOST: postgres-registry
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: enzo2003*
      DB_DATABASE: registry_db
    ports:
      - '3002:3002'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres-registry:
        condition: service_healthy

  operations-service:
    image: node:20-alpine
    container_name: operations-service
    working_dir: /app
    command: sh -c "npm install && npm run start:dev --workspace=operations-service"
    environment:
      NODE_ENV: development
      TCP_HOST: 0.0.0.0
      TCP_PORT: 3003
      DB_HOST: postgres-operations
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: enzo2003*
      DB_DATABASE: operations_db
      REGISTRY_SERVICE_HOST: registry-service
      REGISTRY_SERVICE_PORT: 3002
      DOCUMENTS_SERVICE_HOST: documents-service
      DOCUMENTS_SERVICE_PORT: 3004
      MINIO_ENDPOINT: 192.168.1.10
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: hegervfp
      MINIO_SECRET_KEY: enzo2003*
      MINIO_BUCKET: documents
    ports:
      - '3003:3003'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres-operations:
        condition: service_healthy
      registry-service:
        condition: service_started
      documents-service:
        condition: service_started
      minio:
        condition: service_healthy

  documents-service:
    image: node:20-alpine
    container_name: documents-service
    working_dir: /app
    command: sh -c "npm install && npm run start:dev --workspace=documents-service"
    environment:
      NODE_ENV: development
      TCP_HOST: 0.0.0.0
      TCP_PORT: 3004
      DATABASE_URL: postgres://postgres:enzo2003*@postgres-documents:5432/documents_db
      OPERATIONS_SERVICE_HOST: operations-service
      OPERATIONS_SERVICE_PORT: 3003
      REGISTRY_SERVICE_HOST: registry-service
      REGISTRY_SERVICE_PORT: 3002
    ports:
      - '3004:3004'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres-documents:
        condition: service_healthy
      registry-service:
        condition: service_started

  notifications-service:
    image: node:20-alpine
    container_name: notifications-service
    working_dir: /app
    command: sh -c "npm install && npm run start:dev --workspace=notifications-service"
    environment:
      NODE_ENV: development
      TCP_HOST: 0.0.0.0
      TCP_PORT: 3005
      DB_HOST: postgres-notifications
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: enzo2003*
      DB_DATABASE: notifications_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3005:3005'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres-notifications:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: node:20-alpine
    container_name: gateway
    working_dir: /app
    command: sh -c "npm install && npm run start:dev --workspace=gateway"
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      REGISTRY_SERVICE_HOST: registry-service
      REGISTRY_SERVICE_PORT: 3002
      OPERATIONS_SERVICE_HOST: operations-service
      OPERATIONS_SERVICE_PORT: 3003
      DOCUMENTS_SERVICE_HOST: documents-service
      DOCUMENTS_SERVICE_PORT: 3004
      CORS_ORIGIN: http://localhost:8080,http://localhost:3000,http://192.168.1.10:3000,exp://192.168.1.10:8081,http://192.168.1.10:8080
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      auth-service:
        condition: service_started
      registry-service:
        condition: service_started
      operations-service:
        condition: service_started
      documents-service:
        condition: service_started

volumes:
  postgres-auth-data:
  postgres-registry-data:
  postgres-operations-data:
  postgres-documents-data:
  postgres-notifications-data:
  redis-data:
  minio-data: